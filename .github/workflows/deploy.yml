name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-release-deploy:
    name: Build, Release, Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ietf

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ietf/requirements.txt

      - name: Install PDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info \
            fonts-noto

      - name: Install Python tooling
        working-directory: ietf
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Check drafts and support files
        run: make -C ietf check

      - name: Render release artifacts
        run: make -C ietf render

      - name: Prepare current release artifacts
        run: |
          mapfile -t drafts < <(find ietf/specs -type f -name 'draft-*.md' | sort)
          if (( ${#drafts[@]} == 0 )); then
            echo "Expected at least one specification draft." >&2
            exit 1
          fi

          mkdir release-artifacts
          for draft in "${drafts[@]}"; do
            artifact="artifacts/$(basename "$draft" .md)"
            for extension in html pdf txt xml; do
              cp "${artifact}.${extension}" release-artifacts/
            done
          done

      - name: Publish latest release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release view latest --json assets --jq '.assets[].name' |
              while read -r asset; do
                gh release delete-asset latest "$asset" --yes
              done

            gh release upload latest release-artifacts/*
            gh release edit latest \
              --draft=false \
              --target "${GITHUB_SHA}" \
              --title "Latest AEP specification artifacts" \
              --notes "Auto-published AEP specification artifacts from commit ${{ github.sha }}." \
              --latest
          else
            gh release create latest release-artifacts/* \
              --target "${GITHUB_SHA}" \
              --title "Latest AEP specification artifacts" \
              --notes "Auto-published AEP specification artifacts from commit ${{ github.sha }}." \
              --latest
          fi

          git tag --force latest "${GITHUB_SHA}"
          git push --force origin refs/tags/latest

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
